name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json')); print('manifest OK')"

      - name: Syntax-check all JavaScript
        run: git ls-files '*.js' '*.mjs' | xargs -n1 node --check

      - name: Verify generated assets match generators
        run: |
          python3 tools/generate_sounds.py --check
          python3 tools/generate_icons.py --check

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    continue-on-error: true # informational while runner flakiness is assessed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm i -g playwright@1.56.1
          npx playwright@1.56.1 install --with-deps chromium

      - name: Run smoke test
        run: node tests/e2e/smoke.test.mjs
