[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitmini"
description = "A minimal command-line tool skeleton."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yangwachi123" }]
keywords = ["cli", "git", "tooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
gitmini = "gitmini.cli:main"

[project.urls]
Homepage = "https://github.com/yangwachi123/Gitmini"
Repository = "https://github.com/yangwachi123/Gitmini"
Issues = "https://github.com/yangwachi123/Gitmini/issues"

[tool.hatch.version]
path = "src/gitmini/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmini"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
